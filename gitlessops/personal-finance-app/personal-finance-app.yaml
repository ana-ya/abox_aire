apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-finance-app
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-finance-app
  template:
    metadata:
      labels:
        app: personal-finance-app
    spec:
      containers:
        - name: app
          image: ghcr.io/ana-ya/personal-finance-app:0.1.0
          ports:
            - containerPort: 8501
          env:
            - name: ADK_AGENT_URL
              value: "http://personal-finance-agent:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: personal-finance-app
  namespace: kagent
spec:
  selector:
    app: personal-finance-app
  ports:
    - name: http
      port: 8501
      targetPort: 8501