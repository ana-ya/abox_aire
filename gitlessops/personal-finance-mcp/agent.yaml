apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: finance-advisor-agent
  namespace: kagent
spec:
  description: Personal finance assistant using custom MCP tools.
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |-
      You are an educational personal finance assistant.
      Use the available MCP tools for budget calculations, expense analysis, and debt payoff estimates.
      Do not provide legal, tax, or investment advice.
    tools:
      - type: McpServer
        mcpServer:
          name: personal-finance-mcp
          namespace: kagent
          kind: MCPServer
          toolNames:
            - calculate_monthly_budget
            - analyze_expenses
            - debt_payoff_estimate