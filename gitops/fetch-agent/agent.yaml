apiVersion: kagent.dev/v1alpha2 
kind: Agent 
metadata: 
  name: simple-fetch-agent
  namespace: kagent
spec: 
  description: Agent that can fetch web pages through MCP.
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |-
      You are a helpful assistant. Use the fetch tool when the user asks about a URL or website.
      Answer clearly and concisely.
    tools:
      - type: McpServer
        mcpServer:
          name: mcp-website-fetcher
          kind: MCPServer
          toolNames:
            - fetch